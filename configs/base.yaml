# Base configuration shared by every approach. Approach YAMLs override.

llm:
  model: gemini-3-flash-preview
  temperature: 0.0
  max_output_tokens: 512

embedding:
  model: sentence-transformers/all-MiniLM-L6-v2

reranker:
  model: BAAI/bge-reranker-base

chunking:
  strategy: sentence_window
  target_tokens: 150
  overlap_tokens: 30

retrieval:
  top_k: 5
  top_n_for_rerank: 20

budget:
  cap_usd: 5.0
  warn_pct: 0.5    # log a warning at 50% of cap
  abort_pct: 0.95  # abort runs at 95% of cap

paths:
  eval_corpus: data/eval_corpus
  eval_set: tests/eval_set.jsonl
  runs: runs
