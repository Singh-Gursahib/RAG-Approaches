[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ragureap"
version = "0.1.0"
description = "Lightweight comparison of RAG and non-RAG long-context strategies."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "gursahib99888@gmail.com" }]
license = { text = "Apache-2.0" }
dependencies = [
    "chromadb>=0.5.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0.0",
    "google-generativeai>=0.8.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pandas>=2.0",
    "duckdb>=1.0",
    "plotly>=5.0",
    "streamlit>=1.36",
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
ragureap = "ragureap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
